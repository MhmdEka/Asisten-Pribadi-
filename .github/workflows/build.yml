name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip asisten-pribadi.zip -d work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: work/asisten-pribadi
        run: |
          sed -i '/react-native-android-notification-listener/d' package.json
          npm install --legacy-peer-deps
          npm install expo-image-picker@~15.0.7 expo-document-picker@~12.0.2 expo-file-system@~17.0.1 expo-speech@~12.0.2 --legacy-peer-deps

      - name: Create placeholder assets
        working-directory: work/asisten-pribadi
        run: |
          mkdir -p assets
          curl -sSL -o assets/icon.png https://raw.githubusercontent.com/expo/expo/main/templates/expo-template-blank/assets/icon.png

      - name: Add attachment permissions
        working-directory: work/asisten-pribadi
        run: |
          sed -i 's/"plugins": \["expo-notifications"\]/"plugins": ["expo-notifications", ["expo-image-picker", { "photosPermission": "Aplikasi butuh akses galeri untuk melampirkan foto\/video.", "cameraPermission": "Aplikasi butuh akses kamera untuk mengambil foto." }]]/' app.json

      - name: Create systemActions service
        working-directory: work/asisten-pribadi/src/services
        run: |
          cat > systemActions.js << 'EOF'
          import { Linking, Alert } from 'react-native';

          const APP_PACKAGES = {
            whatsapp: 'com.whatsapp',
            tiktok: 'com.zhiliaoapp.musically',
            instagram: 'com.instagram.android',
            youtube: 'com.google.android.youtube',
            gmail: 'com.google.android.gm',
            chrome: 'com.android.chrome',
            maps: 'com.google.android.apps.maps',
            camera: 'com.android.camera',
            gallery: 'com.google.android.apps.photos',
            playstore: 'com.android.vending',
          };

          const APP_LABELS = {
            whatsapp: 'WhatsApp',
            tiktok: 'TikTok',
            instagram: 'Instagram',
            youtube: 'YouTube',
            gmail: 'Gmail',
            chrome: 'Chrome',
            maps: 'Maps',
            camera: 'Kamera',
            gallery: 'Galeri',
            playstore: 'Play Store',
          };

          export async function openApp(appKey) {
            const packageName = APP_PACKAGES[appKey];
            if (!packageName) return false;
            const intentUrl = `intent:#Intent;action=android.intent.action.SET_ALARM;category=android.intent.category.DEFAULT;i.android.intent.extra.alarm.HOUR=${hour};i.android.intent.extra.alarm.MINUTES=${minute};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(label)};end`;
            try {
              await Linking.openURL(intentUrl);
              return true;
            } catch (e) {
              try {
                await Linking.openURL(`market://details?id=${packageName}`);
              } catch (e2) {
                Alert.alert('Gagal membuka aplikasi', `${APP_LABELS[appKey] || appKey} sepertinya belum terpasang.`);
              }
              return false;
            }
          }

          export async function setAlarm(hour, minute, label = 'Alarm') {
            const intentUrl = `intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${hour};i.android.intent.extra.alarm.MINUTES=${minute};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(label)};end`;
            try {
              await Linking.openURL(intentUrl);
              return true;
            } catch (e) {
              Alert.alert('Gagal membuat alarm', e.message);
              return false;
            }
          }

          export function detectCommand(text) {
            const lower = text.toLowerCase();

            const openMatch = lower.match(/buka\s+(whatsapp|wa|tiktok|instagram|ig|youtube|yt|gmail|chrome|maps|kamera|galeri|play\s?store)/);
            if (openMatch) {
              const map = {
                whatsapp: 'whatsapp', wa: 'whatsapp',
                tiktok: 'tiktok',
                instagram: 'instagram', ig: 'instagram',
                youtube: 'youtube', yt: 'youtube',
                gmail: 'gmail',
                chrome: 'chrome',
                maps: 'maps',
                kamera: 'camera',
                galeri: 'gallery',
                'play store': 'playstore', playstore: 'playstore',
              };
              const key = map[openMatch[1]];
              if (key) return { type: 'open_app', app: key, label: APP_LABELS[key] };
            }

            const alarmMatch = lower.match(/(?:buat|set|pasang)\s+alarm.*?(\d{1,2})(?:[.:h](\d{2}))?/);
            if (alarmMatch) {
              const hour = parseInt(alarmMatch[1], 10);
              const minute = alarmMatch[2] ? parseInt(alarmMatch[2], 10) : 0;
              return { type: 'set_alarm', hour, minute };
            }

            return null;
          }
          EOF

      - name: Replace claudeApi with Gemini
        working-directory: work/asisten-pribadi/src/services
        run: |
          cat > claudeApi.js << 'EOF'
          import AsyncStorage from '@react-native-async-storage/async-storage';

          const API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent';
          const IMAGE_API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image:generateContent';

          export async function getApiKey() {
            return AsyncStorage.getItem('gemini_api_key');
          }

          export async function setApiKey(key) {
            return AsyncStorage.setItem('gemini_api_key', key);
          }

          export async function sendChatMessage(history, systemPrompt = '') {
            const apiKey = await getApiKey();
            if (!apiKey) {
              throw new Error('API key belum diatur. Buka Settings untuk memasukkan Gemini API key Anda.');
            }

            const defaultPrompt =
              'Kamu adalah asisten pribadi yang ramah dan sopan. Selalu panggil user dengan sebutan "Tuan" (misal: "Baik, Tuan", "Tuan bisa coba...", dst), tanpa perlu diminta setiap kali. ' +
              'Selalu jawab dalam Bahasa Indonesia, apapun bahasa yang dipakai user, kecuali user secara eksplisit minta bahasa lain. ' +
              'Jika user mengirimkan tugas, soal, atau pekerjaan (baik berupa teks, foto, maupun dokumen), kerjakan tugas tersebut selengkap dan sejelas mungkin: berikan jawaban lengkap, langkah pengerjaan jika relevan, dan penjelasan yang mudah dipahami, bukan sekadar ringkasan singkat.';
            const finalPrompt = systemPrompt || defaultPrompt;

            const contents = history.map((m) => {
              const parts = [];
              if (m.content) parts.push({ text: m.content });
              if (m.attachment?.base64) {
                parts.push({
                  inline_data: {
                    mime_type: m.attachment.mimeType,
                    data: m.attachment.base64,
                  },
                });
              }
              return {
                role: m.role === 'assistant' ? 'model' : 'user',
                parts,
              };
            });

            const body = {
              contents,
              system_instruction: { parts: [{ text: finalPrompt }] },
            };

            const response = await fetch(`${API_URL}?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });

            if (!response.ok) {
              const errText = await response.text();
              throw new Error(`Gemini API error (${response.status}): ${errText}`);
            }

            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          }

          export async function editImage(base64, mimeType, instruction) {
            const apiKey = await getApiKey();
            if (!apiKey) {
              throw new Error('API key belum diatur. Buka Settings untuk memasukkan Gemini API key Anda.');
            }

            const body = {
              contents: [
                {
                  role: 'user',
                  parts: [
                    { inline_data: { mime_type: mimeType, data: base64 } },
                    { text: instruction },
                  ],
                },
              ],
              generationConfig: { responseModalities: ['TEXT', 'IMAGE'] },
            };

            const response = await fetch(`${IMAGE_API_URL}?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });

            if (!response.ok) {
              const errText = await response.text();
              throw new Error(`Gemini Image API error (${response.status}): ${errText}`);
            }

            const data = await response.json();
            const parts = data.candidates?.[0]?.content?.parts || [];
            const imagePart = parts.find((p) => p.inline_data || p.inlineData);
            const textPart = parts.find((p) => p.text);
            const inline = imagePart?.inline_data || imagePart?.inlineData;

            return {
              text: textPart?.text || '',
              base64: inline?.data || null,
              mimeType: inline?.mime_type || inline?.mimeType || 'image/png',
            };
          }

          export async function summarizeNotifications(notificationTexts) {
            const joined = notificationTexts
              .map((n) => `[${n.sender}] ${n.text}`)
              .join('\n');

            const systemPrompt =
              'Kamu adalah asisten yang meringkas notifikasi WhatsApp menjadi poin-poin singkat dan jelas dalam Bahasa Indonesia. ' +
              'Kelompokkan berdasarkan pengirim. Tandai pesan yang tampak penting/mendesak. Jangan menambahkan opini.';

            return sendChatMessage(
              [{ role: 'user', content: `Ringkas notifikasi berikut:\n\n${joined}` }],
              systemPrompt
            );
          }
          EOF

      - name: Update Settings screen label
        working-directory: work/asisten-pribadi/src/screens
        run: |
          sed -i "s/Anthropic API Key/Gemini API Key/g" SettingsScreen.js
          sed -i "s/console.anthropic.com/aistudio.google.com\/apikey/g" SettingsScreen.js
          sed -i "s/sk-ant-\.\.\./AIza.../g" SettingsScreen.js
          sed -i "s/dikirim ke server manapun selain langsung ke Anthropic\./dikirim ke server manapun selain langsung ke Google./g" SettingsScreen.js

      - name: Replace ChatScreen with full features
        working-directory: work/asisten-pribadi/src/screens
        run: |
          cat > ChatScreen.js << 'EOF'
          import React, { useState, useRef } from 'react';
          import {
            View,
            Text,
            TextInput,
            TouchableOpacity,
            FlatList,
            StyleSheet,
            KeyboardAvoidingView,
            Platform,
            ActivityIndicator,
            Image,
            Alert,
          } from 'react-native';
          import * as ImagePicker from 'expo-image-picker';
          import * as DocumentPicker from 'expo-document-picker';
          import * as FileSystem from 'expo-file-system';
          import * as Speech from 'expo-speech';
          import { sendChatMessage, editImage } from '../services/claudeApi';
          import { detectCommand, openApp, setAlarm } from '../services/systemActions';

          export default function ChatScreen() {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [attachment, setAttachment] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [speakingIndex, setSpeakingIndex] = useState(null);
            const listRef = useRef(null);

            const speak = (text, index) => {
              if (speakingIndex === index) {
                Speech.stop();
                setSpeakingIndex(null);
                return;
              }
              Speech.stop();
              setSpeakingIndex(index);

              const chunks = text.match(/[^.!?\n]+[.!?\n]*/g) || [text];
              const merged = [];
              let current = '';
              chunks.forEach((c) => {
                if ((current + c).length > 350) {
                  if (current) merged.push(current);
                  current = c;
                } else {
                  current += c;
                }
              });
              if (current) merged.push(current);

              let i = 0;
              const speakNext = () => {
                if (i >= merged.length) {
                  setSpeakingIndex(null);
                  return;
                }
                const part = merged[i];
                i += 1;
                Speech.speak(part, {
                  language: 'id-ID',
                  onDone: speakNext,
                  onStopped: () => setSpeakingIndex(null),
                  onError: () => setSpeakingIndex(null),
                });
              };
              speakNext();
            };

            const pickFromGallery = async () => {
              const perm = await ImagePicker.requestMediaLibraryPermissionsAsync();
              if (!perm.granted) return;
              const result = await ImagePicker.launchImageLibraryAsync({
                mediaTypes: ImagePicker.MediaTypeOptions.All,
                base64: true,
                quality: 0.6,
              });
              if (result.canceled) return;
              await setAttachmentFromAsset(result.assets[0]);
            };

            const pickFromCamera = async () => {
              const perm = await ImagePicker.requestCameraPermissionsAsync();
              if (!perm.granted) return;
              const result = await ImagePicker.launchCameraAsync({ base64: true, quality: 0.6 });
              if (result.canceled) return;
              await setAttachmentFromAsset(result.assets[0]);
            };

            const pickDocument = async () => {
              const result = await DocumentPicker.getDocumentAsync({ type: '*/*' });
              if (result.canceled) return;
              const file = result.assets[0];
              try {
                const base64 = await FileSystem.readAsStringAsync(file.uri, {
                  encoding: FileSystem.EncodingType.Base64,
                });
                setAttachment({
                  uri: file.uri,
                  base64,
                  mimeType: file.mimeType || 'application/octet-stream',
                  name: file.name,
                  kind: 'file',
                });
              } catch (e) {
                Alert.alert('Gagal membaca file', e.message);
              }
            };

            const setAttachmentFromAsset = async (asset) => {
              let base64 = asset.base64;
              const isVideo = asset.type === 'video';
              if (!base64) {
                try {
                  base64 = await FileSystem.readAsStringAsync(asset.uri, {
                    encoding: FileSystem.EncodingType.Base64,
                  });
                } catch (e) {
                  Alert.alert('Gagal membaca media', e.message);
                  return;
                }
              }
              setAttachment({
                uri: asset.uri,
                base64,
                mimeType: isVideo ? 'video/mp4' : 'image/jpeg',
                name: isVideo ? 'video.mp4' : 'foto.jpg',
                kind: isVideo ? 'video' : 'image',
              });
            };

            const handleSend = async () => {
              const text = input.trim();
              if (!text && !attachment) return;
              if (loading) return;

              if (text && !attachment) {
                const command = detectCommand(text);
                if (command) {
                  setMessages((prev) => [...prev, { role: 'user', content: text }]);
                  setInput('');
                  let resultText = '';
                  if (command.type === 'open_app') {
                    await openApp(command.app);
                    resultText = `Baik Tuan, membuka ${command.label}...`;
                  } else if (command.type === 'set_alarm') {
                    await setAlarm(command.hour, command.minute);
                    resultText = `Baik Tuan, alarm jam ${String(command.hour).padStart(2, '0')}:${String(command.minute).padStart(2, '0')} sudah dibuat.`;
                  }
                  setMessages((prev) => [...prev, { role: 'assistant', content: resultText }]);
                  setTimeout(() => listRef.current?.scrollToEnd({ animated: true }), 100);
                  return;
                }
              }

              const userMessage = { role: 'user', content: text, attachment };
              const newHistory = [...messages, userMessage];
              setMessages(newHistory);
              setInput('');
              setAttachment(null);
              setLoading(true);
              setError(null);

              try {
                const reply = await sendChatMessage(newHistory);
                setMessages((prev) => [...prev, { role: 'assistant', content: reply }]);
              } catch (e) {
                setError(e.message);
              } finally {
                setLoading(false);
                setTimeout(() => listRef.current?.scrollToEnd({ animated: true }), 100);
              }
            };

            const handleEditImage = async () => {
              if (!attachment || attachment.kind !== 'image') return;
              const instruction = input.trim() || 'Edit foto ini agar lebih menarik';
              const userMessage = { role: 'user', content: `✏️ Edit: ${instruction}`, attachment };
              setMessages((prev) => [...prev, userMessage]);
              setInput('');
              const currentAttachment = attachment;
              setAttachment(null);
              setLoading(true);
              setError(null);

              try {
                const result = await editImage(currentAttachment.base64, currentAttachment.mimeType, instruction);
                if (result.base64) {
                  setMessages((prev) => [
                    ...prev,
                    {
                      role: 'assistant',
                      content: result.text,
                      attachment: {
                        uri: `data:${result.mimeType};base64,${result.base64}`,
                        kind: 'image',
                      },
                    },
                  ]);
                } else {
                  setMessages((prev) => [...prev, { role: 'assistant', content: result.text || 'Tidak ada hasil.' }]);
                }
              } catch (e) {
                setError(e.message);
              } finally {
                setLoading(false);
                setTimeout(() => listRef.current?.scrollToEnd({ animated: true }), 100);
              }
            };

            return (
              <KeyboardAvoidingView style={styles.container} behavior={Platform.OS === 'ios' ? 'padding' : undefined}>
                <FlatList
                  ref={listRef}
                  data={messages}
                  keyExtractor={(_, idx) => idx.toString()}
                  contentContainerStyle={styles.list}
                  renderItem={({ item, index }) => (
                    <View style={[styles.bubble, item.role === 'user' ? styles.userBubble : styles.assistantBubble]}>
                      {item.attachment?.kind === 'image' && (
                        <Image source={{ uri: item.attachment.uri }} style={styles.thumbnail} />
                      )}
                      {item.attachment?.kind === 'video' && <Text style={styles.fileTag}>🎥 Video terlampir</Text>}
                      {item.attachment?.kind === 'file' && <Text style={styles.fileTag}>📄 {item.attachment.name}</Text>}
                      {!!item.content && (
                        <Text style={item.role === 'user' ? styles.userText : styles.assistantText}>{item.content}</Text>
                      )}
                      {item.role === 'assistant' && !!item.content && (
                        <TouchableOpacity onPress={() => speak(item.content, index)} style={styles.speakButton}>
                          <Text style={styles.speakButtonText}>
                            {speakingIndex === index ? '⏹ Berhenti' : '🔊 Dengarkan'}
                          </Text>
                        </TouchableOpacity>
                      )}
                    </View>
                  )}
                  ListEmptyComponent={
                    <Text style={styles.emptyText}>
                      Mulai percakapan dengan asisten Anda. Coba juga ketik "buka whatsapp" atau "buat alarm jam 7".
                    </Text>
                  }
                />
                {error ? <Text style={styles.error}>{error}</Text> : null}
                {loading ? <ActivityIndicator style={{ marginVertical: 8 }} /> : null}

                {attachment && (
                  <View style={styles.attachmentPreview}>
                    {attachment.kind === 'image' ? (
                      <Image source={{ uri: attachment.uri }} style={styles.previewThumb} />
                    ) : (
                      <Text style={styles.fileTag}>
                        {attachment.kind === 'video' ? '🎥 Video dipilih' : `📄 ${attachment.name}`}
                      </Text>
                    )}
                    {attachment.kind === 'image' && (
                      <TouchableOpacity onPress={handleEditImage} style={styles.editButton}>
                        <Text style={styles.editButtonText}>🎨 Edit dengan AI</Text>
                      </TouchableOpacity>
                    )}
                    <TouchableOpacity onPress={() => setAttachment(null)}>
                      <Text style={styles.removeAttachment}>Hapus</Text>
                    </TouchableOpacity>
                  </View>
                )}

                <View style={styles.actionRow}>
                  <TouchableOpacity style={styles.iconButton} onPress={pickFromGallery}>
                    <Text style={styles.iconText}>🖼️</Text>
                  </TouchableOpacity>
                  <TouchableOpacity style={styles.iconButton} onPress={pickFromCamera}>
                    <Text style={styles.iconText}>📷</Text>
                  </TouchableOpacity>
                  <TouchableOpacity style={styles.iconButton} onPress={pickDocument}>
                    <Text style={styles.iconText}>📄</Text>
                  </TouchableOpacity>
                </View>

                <View style={styles.inputRow}>
                  <TextInput
                    style={styles.input}
                    value={input}
                    onChangeText={setInput}
                    placeholder={attachment?.kind === 'image' ? 'Instruksi edit foto (opsional)...' : 'Tulis pesan...'}
                    multiline
                  />
                  <TouchableOpacity style={styles.sendButton} onPress={handleSend}>
                    <Text style={styles.sendText}>Kirim</Text>
                  </TouchableOpacity>
                </View>
              </KeyboardAvoidingView>
            );
          }

          const styles = StyleSheet.create({
            container: { flex: 1, backgroundColor: '#fff' },
            list: { padding: 12, flexGrow: 1 },
            bubble: { borderRadius: 12, padding: 10, marginVertical: 4, maxWidth: '85%' },
            userBubble: { backgroundColor: '#2563eb', alignSelf: 'flex-end' },
            assistantBubble: { backgroundColor: '#f1f5f9', alignSelf: 'flex-start' },
            userText: { color: '#fff' },
            assistantText: { color: '#111827' },
            emptyText: { textAlign: 'center', color: '#9ca3af', marginTop: 40, paddingHorizontal: 20 },
            error: { color: '#dc2626', textAlign: 'center', marginBottom: 4 },
            thumbnail: { width: 200, height: 200, borderRadius: 8, marginBottom: 6 },
            fileTag: { fontStyle: 'italic', marginBottom: 4, color: '#374151' },
            attachmentPreview: {
              flexDirection: 'row',
              alignItems: 'center',
              paddingHorizontal: 12,
              paddingVertical: 6,
              backgroundColor: '#f1f5f9',
              flexWrap: 'wrap',
            },
            previewThumb: { width: 50, height: 50, borderRadius: 6, marginRight: 10 },
            editButton: { backgroundColor: '#7c3aed', borderRadius: 14, paddingHorizontal: 10, paddingVertical: 6, marginRight: 10 },
            editButtonText: { color: '#fff', fontSize: 12, fontWeight: '600' },
            removeAttachment: { color: '#dc2626', marginLeft: 4 },
            actionRow: { flexDirection: 'row', paddingHorizontal: 8, paddingTop: 6, borderTopWidth: 1, borderTopColor: '#e5e7eb' },
            iconButton: { padding: 8, marginRight: 4 },
            iconText: { fontSize: 22 },
            inputRow: { flexDirection: 'row', padding: 8, alignItems: 'flex-end' },
            input: { flex: 1, borderWidth: 1, borderColor: '#d1d5db', borderRadius: 20, paddingHorizontal: 14, paddingVertical: 8, maxHeight: 100 },
            sendButton: { marginLeft: 8, backgroundColor: '#2563eb', borderRadius: 20, paddingHorizontal: 16, paddingVertical: 10 },
            sendText: { color: '#fff', fontWeight: '600' },
            speakButton: { marginTop: 6, alignSelf: 'flex-start' },
            speakButtonText: { color: '#2563eb', fontSize: 12, fontWeight: '600' },
          });
          EOF

      - name: Expo prebuild
        working-directory: work/asisten-pribadi
        run: npx expo prebuild --platform android

      - name: Add package visibility queries
        working-directory: work/asisten-pribadi/android/app/src/main
        run: |
          sed -i 's#</manifest>#  <queries>\n    <package android:name="com.whatsapp"/>\n    <package android:name="com.zhiliaoapp.musically"/>\n    <package android:name="com.instagram.android"/>\n    <package android:name="com.google.android.youtube"/>\n    <package android:name="com.google.android.gm"/>\n    <package android:name="com.android.chrome"/>\n    <package android:name="com.google.android.apps.maps"/>\n    <package android:name="com.google.android.apps.photos"/>\n    <package android:name="com.android.vending"/>\n    <intent>\n      <action android:name="android.intent.action.SET_ALARM"/>\n    </intent>\n  </queries>\n</manifest>#' AndroidManifest.xml

      - name: Build release APK
        working-directory: work/asisten-pribadi/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: work/asisten-pribadi/android/app/build/outputs/apk/release/*.apk
